<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Calcule blocos, cobogós, pavê e betão para a sua obra.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quantificador de Obra</title>
<meta name="theme-color" content="#0A0D0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  color-scheme:dark;
  --bg:#0A0D0C; --bg2:#0F1413; --surface:#141A18; --surface2:#1A2220; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --ink:#F3F1EA; --muted:#8D9892; --dim:#5B6561;
  --accent:#FF7A1A; --accent2:#FFB23F; --accent-ink:#1A0E04; --glow:rgba(255,122,26,.38);
  --blue:#5EC8E5; --blue-dim:rgba(94,200,229,.22); --good:#3DDC97;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;overflow-x:hidden}

/* ---------- fundo: planta técnica + brilho ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx::before{content:"";position:absolute;inset:-2px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),
  linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 20%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 20%,#000 30%,transparent 80%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.orb.a{width:420px;height:420px;background:radial-gradient(circle,#FF7A1A 0%,transparent 65%);top:-160px;right:-120px;animation:drift 18s ease-in-out infinite alternate}
.orb.b{width:360px;height:360px;background:radial-gradient(circle,#1E6F85 0%,transparent 65%);bottom:-140px;left:-140px;opacity:.45;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-60px,80px) scale(1.15)}}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .6s var(--ease),transform .7s var(--ease)}
.splash.out{opacity:0;transform:translateY(-4%) scale(1.04);pointer-events:none}
.splash-in{display:grid;justify-items:center;gap:18px}
.wall{display:grid;grid-template-columns:repeat(4,26px);gap:5px}
.wall i{display:block;height:20px;border-radius:3px;background:linear-gradient(160deg,var(--accent2),var(--accent));box-shadow:0 0 18px var(--glow);
  transform:translateY(-140px);opacity:0;animation:drop .55s var(--spring) forwards}
.wall i.w2{grid-column:span 2}
.wall i.w1{grid-column:span 1}
@keyframes drop{to{transform:none;opacity:1}}
.splash h1{font:900 clamp(40px,11vw,76px)/.9 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:0;display:flex;overflow:hidden}
.splash h1 span{display:inline-block;transform:translateY(105%);animation:rise .6s var(--ease) forwards}
@keyframes rise{to{transform:none}}
.splash p{margin:0;font:600 13px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);opacity:0;animation:fade .6s var(--ease) 1.05s forwards}
.loadbar{width:180px;height:2px;background:var(--line2);border-radius:2px;overflow:hidden}
.loadbar b{display:block;height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;animation:load 1.3s var(--ease) .3s forwards;box-shadow:0 0 10px var(--accent)}
@keyframes load{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}

/* ---------- estrutura ---------- */
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:16px;padding-bottom:40px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding-block:16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:grid;grid-template-columns:repeat(4,7px);gap:2px}
.logo i{height:6px;border-radius:1.5px;background:var(--accent)}
.logo i.s2{grid-column:span 2}
.brand b{font:800 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font:500 10px var(--mono);letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.live{display:flex;align-items:center;gap:7px;font:500 11px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}

.layout{display:grid;gap:16px}
@media (min-width:940px){
  .layout{grid-template-columns:minmax(0,1fr) 440px;align-items:start;gap:28px}
  .hero-wrap{order:2;position:sticky;top:20px}
}

/* ---------- HERO / resultado ---------- */
.hero-wrap{position:relative;z-index:20;padding-top:6px;}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,122,26,.22),transparent 55%),linear-gradient(160deg,#1B2321,#0F1413 70%);
  border:1px solid var(--line2);box-shadow:0 20px 60px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);
  transition:padding .45s var(--ease),border-radius .45s var(--ease),box-shadow .5s var(--ease)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,178,63,.16) 50%,transparent 65%);transform:translateX(-120%)}
.hero.bump::after{animation:sweep .9s var(--ease)}
.hero.bump{box-shadow:0 20px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,122,26,.5),0 0 40px -6px var(--glow)}
@keyframes sweep{to{transform:translateX(120%)}}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--accent2)}
.hero-tag{font:500 11px var(--mono);letter-spacing:.1em;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.readout{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:6px;transition:margin .45s var(--ease)}
.odo{font:900 clamp(64px,19vw,112px)/1 var(--display);display:flex;color:var(--ink);letter-spacing:-.01em;
  text-shadow:0 0 30px rgba(255,122,26,.25);transition:font-size .45s var(--ease)}
.odo .col{position:relative;height:1em;overflow:hidden;width:.52em;text-align:center;
  mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);
  transition:width .4s var(--ease)}
.odo .col.enter{animation:colin .45s var(--ease)}
@keyframes colin{from{width:0;opacity:0}}
.odo .strip{display:flex;flex-direction:column;will-change:transform}
.odo .strip span{height:1em;line-height:1em;display:block}
.odo .sep{width:.18em}
.unit{font:800 clamp(20px,5vw,26px)/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);padding-bottom:.55em;transition:font-size .45s var(--ease)}
.hero-sub{margin-top:8px;font:500 13px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;transition:opacity .3s,max-height .45s var(--ease);max-height:60px;overflow:hidden}
.hero-sub b{color:var(--ink);font-weight:700}
.hero-price{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line2);padding-top:12px;transition:opacity .3s,max-height .45s var(--ease),margin .45s var(--ease),padding .45s var(--ease);max-height:80px;overflow:hidden}
.hero-price span{font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hero-price b{font:800 26px var(--display);letter-spacing:.02em;color:var(--good)}
.meter{margin-top:14px;height:4px;border-radius:4px;background:var(--line2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transform-origin:left;transition:transform .9s var(--ease);box-shadow:0 0 12px var(--accent)}
/* compacto ao rolar (telemóvel) */
@media (max-width:939px){
  .compact .hero{padding:12px 16px;border-radius:16px}
  .compact .odo{font-size:44px}
  .compact .unit{font-size:16px}
  .compact .readout{margin-top:0}
  .compact .hero-sub,.compact .hero-price{max-height:0;opacity:0;margin:0;padding-top:0;border-width:0}
  .compact .meter{margin-top:8px}
}


/* ---------- barra fixa com miniatura ao vivo (telemóvel) ---------- */
.dock{position:fixed;left:0;right:0;top:0;z-index:45;display:flex;align-items:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px;background:#0B0F0E;
  border-bottom:1px solid var(--line2);box-shadow:0 14px 40px -12px rgba(0,0,0,.85);transform:translateY(-115%);transition:transform .45s var(--ease)}
.dock::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .4s}
body.docked .dock{transform:none}
body.focusing .dock::after{opacity:.9}
.dock-mini{flex:0 0 0%;height:0;opacity:0;overflow:hidden;display:grid;place-items:center;border-radius:14px;
  background:radial-gradient(90% 90% at 50% 100%,rgba(94,200,229,.12),transparent 70%),#0F1413;border:1px solid transparent;
  transition:flex-basis .45s var(--ease),height .45s var(--ease),opacity .35s,border-color .35s}
body.focusing .dock-mini{flex-basis:56%;height:112px;opacity:1;border-color:var(--line2)}
.dock-mini > svg{width:100%;height:100%;display:block}
.dock-mini .iso{width:62%;max-width:180px;transform:perspective(600px) rotateX(55deg) rotateZ(-35deg);filter:drop-shadow(0 14px 12px rgba(0,0,0,.6))}
.dock-mini .iso > svg{width:100%;height:auto;display:block}
.dock-read{flex:1;min-width:0;display:grid;gap:2px}
.dock-label{font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-num{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.odo.sm{font-size:42px;text-shadow:0 0 22px rgba(255,122,26,.3)}
body.focusing .odo.sm{font-size:38px}
.dock-price{font:800 18px/1 var(--display);letter-spacing:.03em;color:var(--good)}
.dock-price[hidden]{display:none}
.dock-unit{font:800 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-bottom:.45em}
.dock.reveal .dock-read{animation:reveal .8s var(--spring)}
@keyframes reveal{0%{transform:scale(.92)}45%{transform:scale(1.08)}100%{transform:none}}
@media (min-width:940px){.dock{display:none}}

/* ---------- secções / cartões ---------- */
main{display:grid;gap:14px;min-width:0}
.sec{display:grid;gap:14px}
.sec[hidden]{display:none}
.sec.show > *{animation:up .6s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.985)}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 2px 0}
.sec-head h2{margin:0;font:900 clamp(34px,8vw,52px)/.95 var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sec-head h2 em{font-style:normal;color:var(--accent)}
.sec-head p{margin:0;font:500 12px var(--mono);color:var(--muted);letter-spacing:.08em;text-align:right;max-width:180px}

.card{position:relative;background:linear-gradient(180deg,rgba(26,34,32,.92),rgba(18,24,22,.92));border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:16px;
  transition:opacity .35s var(--ease),filter .35s var(--ease),transform .35s var(--ease),border-color .35s,box-shadow .35s}
.card-title{display:flex;align-items:center;gap:12px;font:800 clamp(22px,6vw,28px)/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);padding-bottom:12px;border-bottom:2px solid rgba(255,122,26,.35)}
.card-title i{font:800 15px/1 var(--mono);font-style:normal;letter-spacing:0;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:9px;min-width:34px;height:34px;display:grid;place-items:center;box-shadow:0 6px 16px -6px var(--glow)}
/* modo foco */
body.focusing main .card:not(.is-focus){opacity:.22}
/* ao editar: sem fundo animado nem desenho grande (mais leve); só a miniatura */
body.focusing .bgfx{display:none}
body.focusing main .viz .viz-stage{visibility:hidden}
body.focusing main .card.is-focus{border-color:rgba(255,122,26,.55);box-shadow:0 0 0 4px rgba(255,122,26,.10),0 24px 50px -20px rgba(0,0,0,.9)}
/* campo em edição sempre em evidência */
.field:focus-within > span,.af:focus-within > span{color:var(--accent2)}
.num:focus-within{background:#1c1510}
.num:focus-within input{color:#fff}
.tabbar{transition:transform .35s var(--ease),opacity .25s}
body.focusing .hero{box-shadow:0 20px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,122,26,.35),0 0 50px -10px var(--glow)}

/* desenho */
.viz{padding:0;overflow:hidden;gap:0}
.viz-stage{position:relative;height:210px;display:grid;place-items:center;
  background:radial-gradient(80% 90% at 50% 100%,rgba(94,200,229,.08),transparent 70%)}
.viz-stage > svg,.viz-stage > div > svg{width:100%;height:100%;display:block;overflow:visible}
.viz-foot{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font:500 11px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.viz-foot b{color:var(--blue);font-weight:700}
.iso{width:78%;max-width:320px;transform:perspective(900px) rotateX(55deg) rotateZ(-35deg);transition:transform .8s var(--ease);filter:drop-shadow(0 30px 25px rgba(0,0,0,.6))}
.iso > svg{height:auto}

/* campos */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields.one{grid-template-columns:1fr}
.fields.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:420px){.fields.three{grid-template-columns:1fr 1fr}.fields.three > :first-child{grid-column:1/-1}}
.field{display:grid;gap:7px;min-width:0}
.field > span{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{display:flex;align-items:stretch;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;transition:border-color .25s,box-shadow .25s}
.num:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.18)}
.num input{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--ink);font:700 22px var(--mono);padding:12px 4px 12px 12px;font-variant-numeric:tabular-nums}
.num input::placeholder{color:var(--dim);font-weight:500}
.num .u{align-self:center;font:600 12px var(--mono);color:var(--muted);padding-right:8px;white-space:nowrap}
.num button{flex:0 0 36px;border:0;background:rgba(255,255,255,.03);color:var(--muted);font:500 20px var(--mono);cursor:pointer;transition:background .2s,color .2s}
.num button:active{background:var(--accent);color:var(--accent-ink)}
.num button:first-child{border-right:1px solid var(--line)}
.num input + .u + button,.num input + button{border-left:1px solid var(--line)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hint{margin:-6px 0 0;font-size:13px;color:var(--muted)}

/* segmentado */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:4px}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:linear-gradient(160deg,var(--accent2),var(--accent));box-shadow:0 6px 20px -6px var(--glow);transition:transform .45s var(--spring),width .45s var(--spring)}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:11px 6px;cursor:pointer;transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--accent-ink)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px;padding-block:2px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
/* pavê: todos os produtos à vista (grelha de 2 colunas) */
#chips-pave{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;margin-inline:0;padding-inline:0}
#chips-pave .chip{min-width:0;padding:9px 12px}
#chips-pave .chip b{font-size:17px}
#chips-pave .chip small{white-space:normal}
.chip{flex:0 0 auto;scroll-snap-align:start;display:grid;gap:2px;text-align:left;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);border-radius:14px;padding:10px 14px;cursor:pointer;
  transition:transform .35s var(--spring),border-color .25s,background .25s,box-shadow .25s}
.chip b{font:800 19px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.chip small{font:500 11px var(--mono);color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(160deg,rgba(255,178,63,.16),rgba(255,122,26,.08));box-shadow:0 0 0 1px var(--accent),0 10px 24px -10px var(--glow);transform:translateY(-2px)}
.chip[aria-pressed="true"] small{color:var(--accent2)}
.chip:active{transform:scale(.95)}

.reveal{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ease),opacity .35s}
.reveal > div{overflow:hidden;min-height:0;display:grid;gap:14px}
.reveal.closed{grid-template-rows:0fr;opacity:0}
.card > .reveal.closed{position:absolute;visibility:hidden;pointer-events:none}

/* detalhe */
.rows{display:grid;gap:0}
.rows .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line2)}
.rows .r:last-child{border-bottom:0}
.rows .r span{color:var(--muted);font-size:14px}
.rows .r b{font:700 16px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rows .r.hl b{color:var(--accent2)}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px}
.btn{position:relative;overflow:hidden;border:0;border-radius:14px;padding:15px 18px;font:700 15px var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .3s var(--spring),box-shadow .3s}
.btn.primary{background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--accent-ink);box-shadow:0 12px 30px -12px var(--glow)}
.btn.ghost{background:var(--bg2);color:var(--ink);border:1px solid var(--line2)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font:700 14px var(--body);padding:12px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:transform .45s var(--spring),opacity .3s}
.toast.on{transform:translate(-50%,0);opacity:1}
.note{margin:0;font-size:12.5px;color:var(--dim);line-height:1.5}

/* ripple */
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s var(--ease);pointer-events:none}
@keyframes rip{to{transform:scale(3.5);opacity:0}}

/* tab bar flutuante */
.tabbar{position:relative;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);
  width:100%;margin:4px 0 14px;padding:6px;border-radius:22px;background:rgba(20,26,24,.78);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);

/* ================= HTML ================= */

  await waitNext(); si++;
  const resumo = $('det-' + k) && $('det-' + k).closest('.card');
  await step(resumo, si, num() + 'O resumo e o WhatsApp', 'No fim fica o resumo: produto, quantidade e preço. Toque em “Enviar resumo” para mandar pelo WhatsApp, ou no botão ao lado para copiar e colar. É só isso!');
  const shareB = resumo && resumo.querySelector('[data-share]'), copyB = resumo && resumo.querySelector('[data-copy]');
  if (shareB) { await handTo(shareB); await tap(); }
  if (copyB) { await handTo(copyB); await tap(); }
  await waitNext(); si++;
  if (!stop) { nextB.textContent = 'Começar'; ov.querySelector('[data-t="skip"]').hidden = true;
    handEl = null; hand.style.transform = `translate(${innerWidth / 2}px,${innerHeight + 40}px)`;
    await step($('hero'), si, 'Agora é a sua vez', 'Os números de exemplo vão ser apagados. Pode rever esta demonstração no botão “?” lá em cima.');
    await waitNext(); }
  cancelAnimationFrame(raf);
  if (k === 'simples') { Object.assign(SQ, origSQ); $('sq-pl').value = SQ.pl ?? ''; $('sq-pw').value = SQ.pw ?? ''; }
  else { Object.assign(S[k], origSel); const set = (id, v) => { const e = $(id); if (e) e.value = v ?? ''; };
    set(k + '-preco', S[k].preco); set(k + '-gw', S[k].gw); set(k + '-gh', S[k].gh); renderChips(k); syncGs(k); }
  inputs.forEach((inp, i) => { inp.value = orig[i]; inp.dispatchEvent(new Event('input', { bubbles: true })); });
  ov.remove(); touring = false; scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' });
}
// aparece sozinha na primeira vez que a pessoa abre cada parte (Simples, Muros, Grelhas, Pavê); depois, pelo botão "?"
const maybeTour = k => { if (!store.get('qo-tour2-' + k, 0)) setTimeout(() => { if (tab === k && !touring && !document.body.classList.contains('drawing')) runTour(k); }, 1200); };
$('helpBtn').addEventListener('click', () => runTour(tab));

/* splash + arranque */
$('splash-t').innerHTML = [...'Quantificador'].map((ch, i) => `<span style="animation-delay:${.45 + i * .035}s">${ch}</span>`).join('');
let seen = false; try { seen = sessionStorage.getItem('qo-splash') === '1'; sessionStorage.setItem('qo-splash', '1'); } catch (e) {}
const sp = $('splash');
let booted = false;
function boot() {
  if (booted) return; booted = true;
  let start = store.get('qo-tab', 'muros'); if (!TABS.includes(start)) start = 'muros';
  odoBig.reset(); odoDock.reset();
  if (MODE === 'simples') setMode('simples', true); else goTab(start, true);
}
TABS.forEach(k => { if (CFG[k].kind === 'floor') applyFloorOrbit(k); });
initDraw();
$('main').insertAdjacentHTML('afterbegin', simpleHTML());
const endSplash = () => { if (sp.classList.contains('out')) return; sp.classList.add('out'); setTimeout(() => sp.remove(), 800); boot(); };
sp.addEventListener('click', endSplash);
update(null, false);
if (seen || RM) { sp.remove(); boot(); } else setTimeout(endSplash, 1900);
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
